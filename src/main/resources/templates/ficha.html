<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Ficha do Animal</title></head>
<body>
<h1>Ficha do Animal</h1>
<p>Nome: <span th:text="${nome}"></span></p>
<p>Espécie: <span th:text="${especie}"></span></p>
<p>Idade: <span th:text="${idade}"></span></p>
<h2>Tutor</h2>
<p>Nome: <span th:text="${tutorNome}"></span></p>
<p>Telefone: <span th:text="${tutorTelefone}"></span></p>
</body>
</html>
